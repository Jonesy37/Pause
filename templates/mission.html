<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="mission-body">
    <!-- Same starfield as the splash page -->
    <div class="stars stars-small"></div>
    <div class="stars stars-medium"></div>
    <div class="stars stars-large"></div>

    <!-- Fixed sidebar with anchor links -->
    <nav class="side-nav" aria-label="Sections">
        <ul>
            <li><a href="#mission"  class="nav-link" data-target="mission">{{ mission_title }}</a></li>
            <li><a href="#solution" class="nav-link" data-target="solution">{{ solution_title }}</a></li>
        </ul>
    </nav>

    <main class="mission">
        <header class="page-header">
            <h1 class="page-title">{{ page_title }}</h1>
            {% if page_tagline %}<p class="page-tagline">{{ page_tagline }}</p>{% endif %}
        </header>

        <section id="mission" class="page-section">
            <h2 class="section-title">{{ mission_title }}</h2>
            <div class="section-body">
                {{ mission_html|safe }}
            </div>
        </section>

        <section id="solution" class="page-section">
            <h2 class="section-title">{{ solution_title }}</h2>
            <div class="section-body">
                {{ solution_html|safe }}
            </div>
        </section>

        <footer class="page-footer">
            {{ authors_html|safe }}
        </footer>
    </main>

    <script>
    // Highlight the sidebar link of the section currently in view.
    (function () {
        const links = document.querySelectorAll('.nav-link');
        const sections = Array.from(links).map(link =>
            document.getElementById(link.dataset.target)
        );

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    links.forEach(l => l.classList.remove('active'));
                    const link = document.querySelector(
                        `.nav-link[data-target="${entry.target.id}"]`
                    );
                    if (link) link.classList.add('active');
                }
            });
        }, { rootMargin: '-40% 0px -50% 0px' });

        sections.forEach(s => s && observer.observe(s));
    })();

    // Parallax on the starfield: each of the three fixed star layers
    // shifts its background-position-y as a fraction of scrollY, so
    // small/distant stars drift slowly and larger/nearer stars move
    // faster. The radial-gradient tiles repeat, so the field looks
    // infinite no matter how far you scroll.
    //
    // Uses requestAnimationFrame + a passive scroll listener so it
    // doesn't interfere with touch scrolling or the main thread.
    (function () {
        // Honor the system "reduced motion" setting — skip parallax.
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const layers = [
            { el: document.querySelector('.stars-small'),  rate: 0.15 },
            { el: document.querySelector('.stars-medium'), rate: 0.30 },
            { el: document.querySelector('.stars-large'),  rate: 0.45 },
        ].filter(l => l.el);

        if (!layers.length) return;

        let ticking = false;
        function update() {
            const y = window.scrollY || window.pageYOffset;
            layers.forEach(({ el, rate }) => {
                el.style.backgroundPositionY = `${-y * rate}px`;
            });
            ticking = false;
        }
        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(update);
                ticking = true;
            }
        }, { passive: true });
        update();  // set initial positions on load
    })();

    // Tap-to-toggle for .tip tooltips on touch devices.
    // Desktop hover still works via pure CSS; this just makes the same
    // popups reachable on phones/tablets where :hover never fires.
    (function () {
        const tips = document.querySelectorAll('.tip');
        tips.forEach(el => {
            el.addEventListener('click', (e) => {
                // Don't stop link clicks — readers should still be able
                // to follow <a> tags inside the pop-up body.
                if (e.target.closest('a')) return;
                // Tapping inside the open pop-up (but not on a link)
                // shouldn't toggle it closed — let readers read.
                if (e.target.closest('.tip-body')) {
                    e.stopPropagation();
                    return;
                }
                e.stopPropagation();
                tips.forEach(o => { if (o !== el) o.classList.remove('open'); });
                el.classList.toggle('open');
            });
        });
        document.addEventListener('click', () => {
            tips.forEach(o => o.classList.remove('open'));
        });
    })();
    </script>
</body>
</html>
